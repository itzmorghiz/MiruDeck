name: Build, Deploy & Package

on:
  push:
    branches: [main]
    tags:
      - "v*" # Triggers when a tag starting with 'v' is pushed (releases/prereleases)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-builds"
  cancel-in-progress: true

jobs:
  # 1. Build and Deploy Web App to GitHub Pages (Runs on EVERY push to main)
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Web App & Extensions
        run: npm run build:all

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Build Native Executables & Android APK (Runs ONLY on version tags/releases)
  build-natives:
    needs: deploy-pages
    # This condition ensures natives only build if a git tag (like v1.0.0 or v1.0.0-rc1) was pushed
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: android
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --- Linux System Dependencies ---
      - name: Install Linux Dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # --- Android SDK & Java Setup ---
      - name: Setup Java
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.name == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android Targets
        if: matrix.name == 'android'
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      # -----------------------------

      - name: Install npm dependencies
        run: npm ci

      # --- Build Commands ---
      - name: Build Linux App
        if: matrix.name == 'linux'
        run: npm run tauri build

      - name: Build Windows App
        if: matrix.name == 'windows'
        run: npm run tauri build

      - name: Build Android APK
        if: matrix.name == 'android'
        run: npm run tauri android build -- --release

      # --- Save Output Artifacts ---
      - name: Upload Linux Bundle Artifacts
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-bundles
          path: src-tauri/target/release/bundle/

      - name: Upload Windows Bundle Artifacts
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-bundles
          path: src-tauri/target/release/bundle/

      - name: Upload Android APK Artifact
        if: matrix.name == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/release/
